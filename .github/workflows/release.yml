# Build completo: los tres sistemas, en amd64 y arm64.
#
# `bun run app:build --release` empaqueta todo lo que la máquina donde corre pueda
# producir, pero ninguna máquina puede producir las seis combinaciones: el bundle de macOS
# necesita el SDK de Apple y `codesign`, que no existen fuera de macOS, y el arm64 de Linux
# necesita hardware ARM de verdad (el bundler de AppImage no cruza). La única forma de
# tener los seis instaladores de una misma versión es compilar cada uno donde corresponde
# — que es lo que hace esta matriz.
#
# Cada runner corre exactamente el mismo comando que se corre a mano, solo que fijando el
# target con `--target`, así que no hay un "camino de CI" distinto del local que pueda
# divergir sin que nadie se entere. `bun run app:build --list` dice, en cualquier máquina,
# qué celdas de esta matriz puede reproducir localmente.

name: release

on:
  push:
    tags: ["v*"]
  # Para probar el build completo sin publicar nada.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Que falle macOS no debería cancelar un Windows que ya iba por la mitad.
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native: true
            # 22.04 y no 24.04: el AppImage enlaza contra la glibc del runner, así que
            # compilar en la más vieja soportada es lo que lo hace correr en más distros.

          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
            # Runner ARM nativo (gratis en repos públicos, disponible en privados). No se
            # cruza desde x64: haría falta un sysroot arm64 completo con webkit2gtk, y el
            # bundler de AppImage además exige correr en la arquitectura de destino.

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true

          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            # Cruzado desde el runner x64 y no en `windows-11-arm`: bun no publica build
            # para Windows arm64, y el frontend se compila con bun. Cruzar no cuesta nada
            # acá — la imagen de VS del runner ya trae las herramientas de ARM64, que es lo
            # que necesita `rusqlite` (bundled) para compilar SQLite con el `cc` de MSVC.
            # Sale solo el NSIS: WiX, el que arma el .msi, no soporta arm64.

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true

          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            # Cruzado desde el runner ARM: el SDK de Apple trae las dos slices, así que
            # alcanza con tener el target de Rust instalado. No hace falta un runner Intel
            # (los `macos-13` están en camino de desaparecer).

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dependencias de sistema de Tauri en Linux (webkit2gtk y compañía) más las que
      # necesita el bundler de AppImage. Los mismos paquetes existen para arm64.
      - name: Dependencias de Linux
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # La clave va por celda y no por sistema: los dos jobs de Windows comparten
          # runner pero compilan targets distintos, y con una clave común se pisarían.
          key: ${{ matrix.name }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-cargo-

      - run: bun install --frozen-lockfile

      # Solo en las celdas nativas: en las cruzadas, `cargo test` compilaría todo el árbol
      # de dependencias otra vez para el host (los tests no pueden correr en la arquitectura
      # de destino), y lo que se testea es exactamente el mismo código.
      - name: Tests
        if: matrix.native
        run: |
          bunx tsc --noEmit
          cd src-tauri && cargo test

      # El mismo comando que se corre a mano, con el target de esta celda fijado.
      - name: Build
        run: bun run app:build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: controlcode-${{ matrix.name }}
          # Que una celda suba un artefacto vacío es peor que fallar: el release quedaría
          # incompleto sin que nada se ponga en rojo.
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
