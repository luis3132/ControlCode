# Build completo: los tres sistemas, en amd64 y arm64.
#
# `bun run app:build --release` empaqueta todo lo que la máquina donde corre pueda
# producir, pero ninguna máquina puede producir las seis combinaciones: el bundle de macOS
# necesita el SDK de Apple y `codesign`, que no existen fuera de macOS, y el arm64 de Linux
# necesita hardware ARM de verdad (el bundler de AppImage no cruza). La única forma de
# tener los seis instaladores de una misma versión es compilar cada uno donde corresponde
# — que es lo que hace esta matriz.
#
# Cada runner corre exactamente el mismo comando que se corre a mano, solo que fijando el
# target con `--target`, así que no hay un "camino de CI" distinto del local que pueda
# divergir sin que nadie se entere. `bun run app:build --list` dice, en cualquier máquina,
# qué celdas de esta matriz puede reproducir localmente.

name: release

on:
  push:
    tags: ["v*"]
  # Para probar el build completo sin publicar nada.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Que falle macOS no debería cancelar un Windows que ya iba por la mitad.
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native: true
            # 22.04 y no 24.04: el AppImage enlaza contra la glibc del runner, así que
            # compilar en la más vieja soportada es lo que lo hace correr en más distros.

          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
            # Runner ARM nativo (gratis en repos públicos, disponible en privados). No se
            # cruza desde x64: haría falta un sysroot arm64 completo con webkit2gtk, y el
            # bundler de AppImage además exige correr en la arquitectura de destino.

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true

          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            # Cruzado desde el runner x64 y no en `windows-11-arm`: bun no publica build
            # para Windows arm64, y el frontend se compila con bun. Cruzar no cuesta nada
            # acá — la imagen de VS del runner ya trae las herramientas de ARM64, que es lo
            # que necesita `rusqlite` (bundled) para compilar SQLite con el `cc` de MSVC.
            # Sale solo el NSIS: WiX, el que arma el .msi, no soporta arm64.

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true

          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            # Cruzado desde el runner ARM: el SDK de Apple trae las dos slices, así que
            # alcanza con tener el target de Rust instalado. No hace falta un runner Intel
            # (los `macos-13` están en camino de desaparecer).

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dependencias de sistema de Tauri en Linux (webkit2gtk y compañía) más las que
      # necesita el bundler de AppImage. Los mismos paquetes existen para arm64.
      # Dos cosas que no son obvias:
      #
      # - `libappindicator3-dev` NO va: entra en conflicto declarado con el de ayatana
      #   ("Conflicts: libappindicator3-dev") y además tiene dependencias rotas en 22.04,
      #   así que pedir los dos hace fallar el apt entero. Tauri v2 usa el de ayatana.
      #
      # - `xdg-utils` sí va, aunque no sea una dependencia de compilación: el bundler mete
      #   `/usr/bin/xdg-open` DENTRO del AppImage, porque es con lo que
      #   `tauri-plugin-opener` abre enlaces. La imagen x64 del runner ya lo trae, la arm64
      #   no — por eso esto fallaba en una sola celda, y recién al empaquetar.
      - name: Dependencias de Linux
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev xdg-utils

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # La clave va por celda y no por sistema: los dos jobs de Windows comparten
          # runner pero compilan targets distintos, y con una clave común se pisarían.
          key: ${{ matrix.name }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-cargo-

      - run: bun install --frozen-lockfile

      # Los chequeos del frontend no dependen del sistema: correrlos en las seis celdas es
      # pagar seis veces por el mismo resultado.
      - name: Tests del frontend
        if: matrix.name == 'linux-amd64'
        run: |
          bunx tsc --noEmit
          bun run test

      # Solo en las celdas nativas: en las cruzadas, `cargo test` compilaría todo el árbol
      # de dependencias otra vez para el host (los tests no pueden correr en la arquitectura
      # de destino), y lo que se testea es exactamente el mismo código.
      #
      # Windows queda afuera, y no por comodidad: el binario de test de la lib no llega a
      # arrancar (`STATUS_ENTRYPOINT_NOT_FOUND`, 0xc0000139). Es que linkea WebView2 y el
      # ejecutable corre desde `target/debug/deps/`, donde el loader no está — un problema
      # del arnés de tests en Windows, no del código: el BUILD de Windows sí pasa. Los tests
      # con gate `#[cfg(windows)]` (los Job Objects de contención) quedan sin cubrir en CI y
      # hay que correrlos a mano en Windows hasta que esto se resuelva.
      - name: Tests de Rust
        if: matrix.native && !startsWith(matrix.name, 'windows')
        run: cd src-tauri && cargo test

      # El cache de cargo trae `target/` entero de la corrida anterior, y el bundler de Tauri
      # nunca vacía `bundle/`: deja el instalador nuevo AL LADO de los que ya había. Con eso
      # el glob del upload de abajo se llevaba todo junto, y cada release salía con los
      # instaladores de las versiones anteriores colgados al lado de los suyos.
      #
      # Se borra solo `bundle/`, no `target/`: lo compilado es justamente lo que el cache
      # viene a ahorrar. Y va ANTES del build aunque abajo también se limpie, porque los
      # caches que ya están guardados en GitHub traen los instaladores viejos adentro — sin
      # este paso, la próxima versión los volvería a publicar.
      #
      # `bash` explícito: en Windows el shell por defecto es PowerShell, donde `rm -rf` no
      # existe.
      - name: Limpiar instaladores de versiones anteriores
        shell: bash
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

      # El mismo comando que se corre a mano, con el target de esta celda fijado.
      - name: Build
        run: bun run app:build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: controlcode-${{ matrix.name }}
          # Que una celda suba un artefacto vacío es peor que fallar: el release quedaría
          # incompleto sin que nada se ponga en rojo.
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # Los instaladores ya viajaron como artifact al job que publica, así que en este
      # runner no hacen más falta. Borrarlos acá, antes de que termine el job, es lo que los
      # deja FUERA del cache de cargo, que se guarda recién al final: cientos de megas por
      # celda que no sirven para compilar nada y que son los que después se colaban en la
      # versión siguiente.
      - name: Sacar los instaladores del cache
        shell: bash
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

  # Los artifacts de arriba caducan y solo los ve quien entra al run. Este trabajo es el
  # que convierte ese build en algo que la gente puede descargar: crea el release del tag
  # y le cuelga los instaladores de las seis celdas.
  #
  # Corre una sola vez, cuando TODAS terminaron, para que no exista un release a medias
  # con Linux publicado y macOS todavía compilando.
  publish:
    needs: build
    # `workflow_dispatch` sirve para probar el build sin publicar nada: sin tag, no hay
    # release que hacer.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Lo único que este trabajo necesita poder hacer: escribir el release.
      contents: write

    steps:
      # Por las notas escritas a mano (ver abajo); acá no se compila nada.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # `upload-artifact` conserva la estructura de directorios, así que los instaladores
      # llegan enterrados en target/<triple>/release/bundle/<tipo>/. Se aplanan porque es
      # el nombre del archivo lo que ve quien descarga, no su ruta en el runner.
      - name: Juntar los instaladores
        run: |
          set -euo pipefail
          mkdir -p dist
          antes=$(find artifacts -type f | wc -l)
          # `-n` no pisa: dos celdas que produzcan el mismo nombre de archivo tienen que
          # notarse acá y no como un release al que le falta silenciosamente el arm64.
          find artifacts -type f -exec mv -n -t dist/ {} +
          despues=$(find dist -type f | wc -l)
          if [ "$antes" -ne "$despues" ]; then
            echo "::error::$antes archivos en $despues destinos — hay nombres repetidos entre celdas"
            find artifacts -type f
            exit 1
          fi

          # Última red, por si algún día vuelve a colarse algo. Los instaladores de Tauri
          # llevan siempre la versión en el nombre (controlcode_1.6.0_amd64.deb,
          # controlcode-1.6.0-1.x86_64.rpm…), así que uno que no la lleve es un resto de otra
          # versión — y es preferible un release en rojo a uno que ofrece la versión vieja
          # como si fuera la nueva. Se compara la parte numérica: el sufijo de una
          # prerelease (-beta.1) no todos los empaquetadores lo escriben igual.
          version="${GITHUB_REF_NAME#v}"
          nucleo="${version%%-*}"
          ajenos=$(find dist -type f ! -name "*${nucleo}*")
          if [ -n "$ajenos" ]; then
            echo "::error::Hay instaladores que no son de la versión $version"
            echo "$ajenos"
            exit 1
          fi

          echo "Se van a publicar $despues archivos:"
          ls -lh dist/

      # Las notas se escriben a mano en `.github/releases/<tag>.md` y se versionan con el
      # código: un release describe QUÉ CAMBIÓ para quien lo usa, y eso no sale de la lista
      # de commits. Si el archivo no está, GitHub genera las suyas — un release con notas
      # automáticas es peor que uno con notas escritas, pero mucho mejor que uno sin nada.
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=".github/releases/${tag}.md"

          args=(--verify-tag --title "$tag")
          if [ -f "$notes" ]; then
            echo "Notas: $notes"
            args+=(--notes-file "$notes")
          else
            echo "No hay $notes — GitHub genera las notas"
            args+=(--generate-notes)
          fi

          # Un tag con guion (v1.5.0-beta.1) es una prerelease: no se ofrece como "última
          # versión" ni le llega a quien sigue el repo esperando algo estable.
          case "$tag" in *-*) args+=(--prerelease) ;; esac

          # Idempotente: si el release ya existe (un re-run del workflow, o una celda que
          # se reintentó), se le reemplazan los archivos en vez de fallar.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "El release $tag ya existe — reemplazando sus archivos"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* "${args[@]}"
          fi
