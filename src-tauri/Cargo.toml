[package]
name = "controlcode"
version = "1.3.0"
description = "Control Code — AI coding agent command center"
authors = ["you"]
edition = "2021"
# El crate emite dos binarios (`controlcode` de la app y `ccode` de la CLI), así que
# cargo/tauri necesitan saber cuál es el principal para empaquetar.
default-run = "controlcode"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "controlcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# La CLI sale del MISMO crate que la app para poder reusar `ipc::protocol` de la lib —
# así el formato del mensaje no puede desincronizarse entre las dos puntas.
#
# Se llama `ccode` y no `controlcode` porque ese nombre ya lo ocupa el ejecutable de la
# app (`productName` en tauri.conf.json), y cargo no puede emitir dos binarios homónimos.
# Renombrar el de la app tampoco es opción: esta versión de Tauri no expone
# `mainBinaryName` en su schema de configuración.
[[bin]]
name = "ccode"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fase 0 — Terminal embebido (PTY)
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }

# Fase 0 — Persistencia SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Utils
uuid = { version = "1", features = ["v4"] }
dirs = "5"
lazy_static = "1"

# Fase 5 — Skills manager (symlinks globales)
serde_yaml = "0.9"
symlink = "0.1"

# Fase 6 — Marketplace de skills (registries remotos)
# rustls en vez de la TLS nativa del sistema: evita depender de libssl/openssl-dev
# instalado en la máquina del usuario para poder compilar/correr.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Señales POSIX: matar el GRUPO de procesos de una tab y no solo a su líder, para que no
# queden huérfanos los procesos que el agente haya lanzado (ver terminal::pty_manager).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Objects: el equivalente en Windows del cgroup que se usa en Linux para que la
# descendencia de una tab muera con ella (ver terminal::containment).
[target.'cfg(windows)'.dependencies]
# La versión NO es arbitraria: tiene que ser la misma que ya domina el árbol (la traen
# tauri y sus dependencias). Con una 0.59 conviven dos generaciones de `windows-targets`,
# una con import libs y otra con `raw-dylib`, y el binario resultante compila pero no
# carga: STATUS_ENTRYPOINT_NOT_FOUND al arrancar, antes de ejecutar nada.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # `CreateJobObjectW` recibe un `SECURITY_ATTRIBUTES` y
    # `JOBOBJECT_EXTENDED_LIMIT_INFORMATION` vive bajo Threading: sin estos dos features
    # los símbolos existen pero quedan compilados fuera.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
