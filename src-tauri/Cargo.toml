[package]
name = "controlcode"
version = "0.1.0"
description = "Control Code — AI coding agent command center"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "controlcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# La CLI sale del MISMO crate que la app para poder reusar `ipc::protocol` de la lib —
# así el formato del mensaje no puede desincronizarse entre las dos puntas.
#
# Se llama `ccode` y no `controlcode` porque ese nombre ya lo ocupa el ejecutable de la
# app (`productName` en tauri.conf.json), y cargo no puede emitir dos binarios homónimos.
# Renombrar el de la app tampoco es opción: esta versión de Tauri no expone
# `mainBinaryName` en su schema de configuración.
[[bin]]
name = "ccode"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fase 0 — Terminal embebido (PTY)
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }

# Fase 0 — Persistencia SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Utils
uuid = { version = "1", features = ["v4"] }
dirs = "5"
lazy_static = "1"

# Fase 5 — Skills manager (symlinks globales)
serde_yaml = "0.9"
symlink = "0.1"

# Fase 6 — Marketplace de skills (registries remotos)
# rustls en vez de la TLS nativa del sistema: evita depender de libssl/openssl-dev
# instalado en la máquina del usuario para poder compilar/correr.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
